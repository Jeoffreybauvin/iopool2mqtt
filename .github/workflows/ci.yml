name: CI

on:
  pull_request:
    branches: ["main", "master", "develop"]
  push:
    branches: ["develop", "feat/**", "fix/**", "chore/**", "refactor/**"]
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Rustdoc generation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  test:
    name: Unit & Integration Tests (with NanoMQ)
    runs-on: ubuntu-latest
    services:
      nanomq:
        image: emqx/nanomq:latest
        ports:
          - 1883:1883
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run all unit, integration, and doc tests
        env:
          TEST_MQTT_HOST: 127.0.0.1
          TEST_MQTT_PORT: 1883
        run: cargo test --all-targets --all-features -- --nocapture

      - name: Run doctests
        run: cargo test --doc

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: iopool2mqtt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container fails fast without IOPOOL_API_KEY
        run: |
          if docker run --rm iopool2mqtt:ci 2>&1 | grep -q "IOPOOL_API_KEY"; then
            echo "Container properly validated missing IOPOOL_API_KEY"
          else
            echo "Expected container to report missing IOPOOL_API_KEY"
            exit 1
          fi
