# git-cliff configuration for generating CHANGELOG.md and GitHub Release notes
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Toutes les modifications notables de ce projet sont documentées dans ce fichier.
Le format est basé sur [Keep a Changelog](https://keepachangelog.com/fr/1.1.0/),
et ce projet adhère au [Semantic Versioning](https://semver.org/lang/fr/).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**BREAKING**] {% endif %}\
            {{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Jeoffreybauvin/iopool2mqtt/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Jeoffreybauvin/iopool2mqtt/issues/${2}))" },
]
commit_parsers = [
    { message = "^chore\\(release\\):", skip = true },
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Nouvelles fonctionnalités" },
    { message = "^fix", group = "<!-- 1 -->🐛 Corrections de bugs" },
    { message = "^sec|^security", group = "<!-- 2 -->🔒 Sécurité" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performances" },
    { message = "^refactor", group = "<!-- 4 -->🚜 Refactoring" },
    { message = "^doc|^docs", group = "<!-- 5 -->📚 Documentation" },
    { message = "^test|^tests", group = "<!-- 6 -->🧪 Tests" },
    { message = "^ci|^build", group = "<!-- 7 -->⚙️ CI/CD & Build" },
    { message = "^chore", group = "<!-- 8 -->🧹 Maintenance" },
    { body = ".*", group = "<!-- 9 -->📦 Autres changements" },
]
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
