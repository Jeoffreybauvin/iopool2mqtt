services:
  nanomq:
    image: emqx/nanomq:latest
    container_name: nanomq
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"

  iopool2mqtt:
    build:
      context: .
      dockerfile: Dockerfile
    image: jeoffrey54/iopool2mqtt:latest
    container_name: iopool2mqtt
    restart: unless-stopped
    depends_on:
      - nanomq
    env_file:
      - .env
    environment:
      # Override MQTT_HOST in Docker network to point to the NanoMQ service
      MQTT_HOST: ${MQTT_DOCKER_HOST:-nanomq}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USE_POOL_TITLE: ${MQTT_USE_POOL_TITLE:-false}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS:-300}
      RUN_ONCE: ${RUN_ONCE:-false}
      HA_DISCOVERY_ENABLED: ${HA_DISCOVERY_ENABLED:-true}
      RUST_LOG: ${RUST_LOG:-info,iopool2mqtt=info}
